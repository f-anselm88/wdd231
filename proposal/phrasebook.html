<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phrasebook — Rukwangali Phrasebook</title>
  <meta name="description" content="Browse and filter everyday Rukwangali phrases by category, with translations and usage notes.">
  <meta name="author" content="Anselm Munango">

  <meta property="og:title" content="Rukwangali Phrasebook">
  <meta property="og:description" content="Browse everyday Rukwangali phrases by category, with translations and usage notes.">
  <meta property="og:type" content="website">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌾</text></svg>">

  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/phrasebook.css">
  <script type="module" src="scripts/main.js"></script>
  <script type="module" src="scripts/phrasebook.js"></script>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <p class="site-title">Rukwangali <span>Phrasebook</span></p>
      <button class="nav-toggle" aria-expanded="false" aria-controls="primary-menu">
        Menu ☰
      </button>
    </div>
    <nav class="primary-nav" aria-label="Primary">
      <ul id="primary-menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="phrasebook.html">Phrasebook</a></li>
        <li><a href="community.html">Community</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Everyday phrases</h1>
    <p>Filter by category, then select a phrase to see a fuller usage note. Your last filter is remembered
      the next time you visit.</p>

    <div id="filter-bar" class="filter-bar" role="group" aria-label="Filter phrases by category">
      <!-- filter buttons are generated by scripts/phrasebook.js -->
    </div>

    <p id="phrase-count" class="phrase-count" aria-live="polite"></p>

    <div id="phrase-grid" class="phrase-grid" aria-live="polite">
      <!-- phrase cards are generated by scripts/phrasebook.js -->
    </div>
  </main>

  <dialog id="phrase-modal" aria-labelledby="modal-rukwangali">
    <p class="category-tag" id="modal-category"></p>
    <h2 id="modal-rukwangali"></h2>
    <p id="modal-english"></p>
    <p id="modal-note"></p>
    <button id="modal-close" class="modal-close" type="button">Close</button>
  </dialog>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>&copy; <span id="current-year"></span> Anselm Munango. Built for WDD 231.</p>
      <p><a href="attributions.html">Attributions</a></p>
      <p><a href="#">Video demonstration</a> (link to be added)</p>
    </div>
  </footer>

</body>
</html>
